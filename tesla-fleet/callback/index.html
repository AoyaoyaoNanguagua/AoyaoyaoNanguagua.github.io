<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Tesla OAuth callback</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    code { word-break: break-all; background: #f4f4f4; padding: 0.2em 0.4em; }
  </style>
</head>
<body>
  <h1>授权回调</h1>
  <p>若看到本页，说明重定向 URI 已生效。请把地址栏完整 URL（含 <code>?code=</code>）复制发给助手。</p>
  <pre id="out"></pre>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get('code');
    const err = p.get('error');
    const el = document.getElementById('out');
    if (err) el.textContent = '错误: ' + err + ' ' + (p.get('error_description') || '');
    else if (code) el.textContent = 'code=' + code + '\nstate=' + (p.get('state') || '');
    else el.textContent = location.href;
  </script>
</body>
</html>
